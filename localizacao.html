<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ô Mineiro — Localização</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Mono:wght@400;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="localizacao.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <div class="eyebrow">Casa Forte · Recife</div>
        <h1 class="brand">Onde nos encontrar</h1>
        <div class="hero-rule"></div>
      </div>

      <div class="info-card">
        <div class="info-row">
          <div class="info-icon">📍</div>
          <div>
            <div class="info-label">Endereço</div>
            <div class="info-value">
              Rua Nestor Silva, 162
              <span class="note">Casa Forte, Recife — PE</span>
            </div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">🕐</div>
          <div>
            <div class="info-label">Horário de funcionamento</div>
            <div class="info-value">
              Domingo a sexta
              <span class="note">das 11h às 15h</span>
            </div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">☎</div>
          <div>
            <div class="info-label">Telefone / WhatsApp</div>
            <div class="info-value">(81) 99373-5673</div>
          </div>
        </div>
      </div>

      <div class="map-frame">
        <iframe
          src="https://www.google.com/maps?q=Rua+Nestor+Silva,+162+-+Casa+Forte,+Recife+-+PE&output=embed"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </div>

      <div class="actions">
        <a
          class="btn btn-maps"
          href="https://www.google.com/maps/place/%C3%B4+mineiro+casa+forte/data=!4m2!3m1!1s0x7ab19d0b8737c8f:0xaea68ed3a8210f81?sa=X&ved=1t:242&ictx=111"
          target="_blank"
          rel="noopener"
        >
          Como chegar
        </a>
        <a
          class="btn btn-whats"
          href="https://wa.me/5581993735673"
          target="_blank"
          rel="noopener"
        >
          Chamar no WhatsApp
        </a>
      </div>

      <footer>
        <div class="line"></div>
        Ô Mineiro — sabor de Minas, direto na brasa
      </footer>
    </div>
  </body>
</html>
